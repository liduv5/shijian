<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* 访问码自愈 + 加载兜底（必须内联、必须最先执行）
   站点静态资源要求带 ?sharecode=。手机浏览器若丢失访问码 cookie，
   HTML 能显示但所有 js/css 会 403，表现为「进度条卡住、按钮点不动」。
   这里不依赖任何外部资源：补参数、注册 SW、加载失败时自动重载一次并给出入口。 */
(function () {
  /* 访问码会随重新发布变化，写死迟早过期：优先用当前链接里的码并记住，
     以后从桌面图标 / 裸链接打开时自动补回最新的那个。 */
  var SC_LS = 'sj_sharecode';
  var u = new URL(location.href);
  var fromUrl = u.searchParams.get('sharecode') || '';
  var SC = fromUrl || 'X4WPKTHLIN';
  /* 发布时五处同步改：这里 SWV、sw.js VERSION、pwa.js SW_BUILD 兜底、
     mobilesync.js BUILD、quick.html 末尾 SW 注册脚本里的 SWV。
     内联兜底注册必须和 pwa.js / 速记页用**完全相同**的脚本 URL：两个不同
     v= 会互相顶替安装，每次启动都触发 controllerchange → 整页自动刷新，
     刚点开的列表抽屉被刷掉，看起来就是「闪一下又回到笔记」。 */
  var SWV = '2026-11-28-196';
  window.__SJ_SWV__ = SWV;
  try {
    var saved = localStorage.getItem(SC_LS) || '';
    if (fromUrl && fromUrl !== saved) localStorage.setItem(SC_LS, fromUrl);
    else if (!fromUrl && saved) SC = saved;
  } catch (_) {}
  var hadCode = !!u.searchParams.get('sharecode');
  var fixed = false, reloaded = false;
  try {
    fixed = sessionStorage.getItem('sj_sc_fixed') === '1';
    reloaded = sessionStorage.getItem('sj_boot_reload') === '1';
  } catch (_) {}
  if (!hadCode && !fixed) {
    try { sessionStorage.setItem('sj_sc_fixed', '1'); } catch (_) {}
    u.searchParams.set('sharecode', SC);
    location.replace(u.toString());
    return;
  }
  /* 即使后面的脚本全挂，也要让 SW 有机会换掉坏缓存 */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try {
      navigator.serviceWorker.register('/sw.js?sharecode=' + SC + '&v=' + SWV, { scope: '/' })
        .catch(function () {});
    } catch (_) {}
  }
  /* 版本守卫。写在这里而不是 app.js 里，因为 HTML 每次都是从网络取的、一定是
     新的，而它引用的 app.js 可能被旧 Service Worker 塞了缓存 —— 于是「页面是
     新的、脚本是旧的」，行为跟前一版一模一样，界面上还看不出来。这就是「改了
     好多次都没反应」的来源。这里拿接管页面的 SW 版本号和 SWV 比，不一致就
     注销 SW + 清空缓存 + 重载一次（每次会话只做一次，避免来回刷）。 */
  if ('serviceWorker' in navigator) {
    /* 标记里存的是**版本号**而不是 '1'：每次发布 SWV 都会变，于是每个新版本都能
       再拿到一次自愈机会。早先写死 '1' 时，同一会话里发布的新版永远等不到修复 ——
       手机一直跑旧 app.js，界面上却完全看不出来（-54/-55「点了没反应」很可能就是
       这个叠加出来的）。 */
    var verFixed = false;
    try { verFixed = sessionStorage.getItem('sj_ver_fix') === SWV; } catch (_) {}
    var verGuard = function () {
      if (verFixed) return;
      var c = null;
      try { c = navigator.serviceWorker.controller; } catch (_) {}
      if (!c) return;
      var have = '';
      try { have = new URL(c.scriptURL).searchParams.get('v') || ''; } catch (_) {}
      if (have === SWV) return;
      verFixed = true;
      try { sessionStorage.setItem('sj_ver_fix', SWV); } catch (_) {}
      Promise.resolve()
        .then(function () { return navigator.serviceWorker.getRegistrations(); })
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .then(function () {
          var t = new URL(location.href);
          t.searchParams.set('fix', String(Date.now()));
          location.replace(t.toString());
        })
        .catch(function () {});
    };
    verGuard();
    try {
      navigator.serviceWorker.addEventListener('controllerchange', verGuard);
    } catch (_) {}
  }
  /* ---------------------------------------------------------- 发现新版本按钮
     上面的自动守卫要「重新打开页面 + 旧 SW 已接管」两个条件同时成立才生效；
     手机常驻后台、HTML 走网络而脚本走旧缓存时可能都碰不上，于是「改了没反应」
     完全无从察知。这里做三层探测，任一命中就在顶部放一个不挡事的提示：
       ① 页面是新的，但 app.js 还是旧构建（HTML 与脚本各缓存一份，最常见）
       ② 接管页面的 Service Worker 仍停在旧版本
       ③ 服务器上的 sw.js 版本已领先本页（常驻后台不关页也会发现）
     探测到之后先自己修一次（清缓存重开），只有修不动才提示 —— 用户不该为
     「版本没换过来」反复点按钮。所有样式内联，不依赖可能被缓存的 style.css。 */
  /* 提示去重标记必须放 localStorage：手机上把应用从最近任务里划掉再进来，
     sessionStorage 会被清空，于是每次冷启动都重新弹一遍 —— 这就是「划掉重进，
     每次都有发现新版本」。放 localStorage 后同一个版本最多提示一次。 */
  var UPDATE_SEEN = 'sj_update_seen_';
  var HEAL_KEY = 'sj_autoheal_';
  var HARD_KEY = 'sj_hard_';
  var BOOT_AT = Date.now();
  var updateShown = false;
  /* 光标是不是正停在可输入的地方。自动重开前必须问一句 —— 宁可晚一次，
     也不能把用户正在写的字刷掉。 */
  function typingNow() {
    try {
      var a = document.activeElement;
      return !!(a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName || '')));
    } catch (_) { return false; }
  }
  function showUpdateTip() {
    if (updateShown || document.getElementById('sjUpdateTip')) return;
    var seen = false;
    try { seen = localStorage.getItem(UPDATE_SEEN + SWV) === '1'; } catch (_) {}
    /* 同一个版本上次已经提示过、这次还在报「有新版」：说明上次点更新没换过来
       （多半是网络慢，页面又被浏览器缓存的旧副本顶替了）。这时再给一次更彻底的
       重来 —— 只给一次，之后彻底闭嘴，不再反复弹。 */
    if (seen) {
      if (!typingNow() && hardReset()) return;
      return;
    }
    if (document.readyState === 'loading' || !document.body) {
      document.addEventListener('DOMContentLoaded', function () { showUpdateTip(); }, false);
      return;
    }
    updateShown = true;
    try { localStorage.setItem(UPDATE_SEEN + SWV, '1'); } catch (_) {}
    var box = document.createElement('div');
    box.id = 'sjUpdateTip';
    box.setAttribute('role', 'status');
    box.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99998;'
      + 'display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);flex-wrap:nowrap;'
      /* 兜底 UI 不能依赖 style.css（要覆盖的场景之一就是 CSS 挂了），但也不该
         写死旧墨绿：界面在宽屏是石墨灰 #43403a、窄屏是华为蓝 #0a59f7，墨绿只在
         两者之间的灰色地带出现，于是这个按钮看着像上一代遗留。这里统一用中性
         石墨灰 —— 深色底 + 白字，浅色/深色主题下都清晰，也不会跟任何主题打架。 */
      + 'padding:9px 10px 9px 14px;border-radius:14px;background:#43403a;color:#fff;'
      + 'box-shadow:0 6px 24px rgba(0,0,0,.22);'
      + 'font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
    /* 三块都锁成不换行、不收缩：点「点此更新」后按钮文字变成「正在更新…」，
       flex 默认允许收缩，窄屏上会被挤成两行、撑破墨灰背景。按钮再给一个固定
       最小宽度，两种文案切换时外框不会忽宽忽窄。 */
    box.innerHTML = '<span style="white-space:nowrap;flex:none">发现新版本</span>'
      + '<button id="sjUpdateGo" style="border:0;border-radius:9px;background:#fff;color:#43403a;'
      + 'padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;'
      + 'white-space:nowrap;flex:none;min-width:100px;box-sizing:border-box">点此更新</button>'
      + '<button id="sjUpdateNo" aria-label="稍后再说" style="border:0;background:transparent;color:#fff;'
      + 'font-size:18px;line-height:1;padding:2px 4px;cursor:pointer;white-space:nowrap;flex:none">×</button>';
    document.body.appendChild(box);
    var no = document.getElementById('sjUpdateNo');
    if (no) no.onclick = function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    };
    var go = document.getElementById('sjUpdateGo');
    if (go) go.onclick = function () {
      go.disabled = true;
      go.textContent = '正在更新…';
      refreshNow('sjup');
    };
  }
  /* 注销 SW + 清缓存 + 带时间戳重开。更新按钮与自动自愈共用同一套动作，
     免得两条路径的行为慢慢走偏。 */
  function refreshNow(param) {
    try { if (window.SJSaveNow) window.SJSaveNow(); } catch (_) {}
    var done = false;
    var finish = function () {
      if (done) return;
      done = true;
      var t = new URL(location.href);
      t.searchParams.set(param || 'sjup', String(Date.now()));
      location.replace(t.toString());
    };
    /* 老内核的 Promise 链可能一直挂着；4 秒兜底硬刷，保证一定能离开旧页面。 */
    setTimeout(finish, 4000);
    if (!('serviceWorker' in navigator)) { finish(); return; }
    Promise.resolve()
      .then(function () { return navigator.serviceWorker.getRegistrations(); })
      .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .catch(function () {})
      .then(function () { return window.caches ? caches.keys() : []; })
      .then(function (ks) {
        /* 下载中转缓存（sjdl-v1）里是正在下载的文件字节，别一起清掉。 */
        return Promise.all(ks.filter(function (k) { return k !== 'sjdl-v1'; })
          .map(function (k) { return caches.delete(k); }));
      })
      .catch(function () {})
      .then(finish, finish);
  }
  /* 自动自愈：探测到「本页确实落后」时直接修，不再等用户点。
     只在刚启动的一分钟内、页面在前台、且没停在输入框里时动手 ——
     否则用户正写到一半，一条定时探测就可能把内容刷掉。
     每个目标版本只自动试一次（标记按目标版本存，不会死循环）；
     已经试过还是旧版，就回落成顶部提示，交用户自己挑时机。 */
  function autoHeal(target) {
    try {
      if (!target) return false;
      if (Date.now() - BOOT_AT > 60000) return false;
      if (document.visibilityState !== 'visible') return false;
      if (typingNow()) return false;
      if (localStorage.getItem(HEAL_KEY + target) === '1') return false;
      localStorage.setItem(HEAL_KEY + target, '1');
    } catch (_) { return false; }
    refreshNow('sjfix');
    return true;
  }
  /* 兜底的彻底重来：同一个版本第二次报「有新版」才用，一辈子只用一次。
     比 autoHeal 更狠 —— 不再限定启动后一分钟内，因为它就是在「上次明明修过
     却没用」的场合出场。 */
  function hardReset() {
    try {
      if (localStorage.getItem(HARD_KEY + SWV) === '1') return false;
      localStorage.setItem(HARD_KEY + SWV, '1');
    } catch (_) { return false; }
    refreshNow('sjfix');
    return true;
  }
  function checkUpdate() {
    /* ① HTML 是新版、脚本还是旧版 */
    try {
      var appB = window.__SJ_APP_BUILD__;
      if (appB && appB !== SWV) {
        if (!autoHeal(SWV)) showUpdateTip();
        return;
      }
    } catch (_) {}
    /* ② 接管页面的 SW 仍是旧版。新 SW 装好会 skipWaiting + claim，接管在毫秒级
       完成；此刻若已有 installing / waiting，说明正在换，静默等它，别误报。 */
    try {
      var c = ('serviceWorker' in navigator) ? navigator.serviceWorker.controller : null;
      if (c) {
        var have = new URL(c.scriptURL).searchParams.get('v') || '';
        if (have && have !== SWV) {
          var reg = navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : null;
          if (reg && reg.then) {
            reg.then(function (r) {
              if (r && (r.installing || r.waiting)) return;
              if (!autoHeal(SWV)) showUpdateTip();
            }).catch(function () { if (!autoHeal(SWV)) showUpdateTip(); });
          } else if (!autoHeal(SWV)) showUpdateTip();
          return;
        }
      }
    } catch (_) {}
    /* ③ 服务器上已发了更新的版本；sw.js 本身不在 SW 资源白名单里，
       这里再带唯一时间戳 + no-store，绕开浏览器与 CDN 的旧副本。 */
    try {
      var probe = '/sw.js?sharecode=' + encodeURIComponent(SC) + '&t=' + Date.now();
      fetch(probe, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (txt) {
          var m = /const\s+VERSION\s*=\s*'sj-([^']+)'/.exec(txt || '');
          /* 只有服务器版本「领先」才提示：CDN 万一吐出旧副本，不能反过来误报。
             版本号固定 YYYY-MM-DD-NNN，字典序即时间序。 */
          if (m && m[1] > SWV) { if (!autoHeal(m[1])) showUpdateTip(); }
        })
        .catch(function () {});
    } catch (_) {}
  }
  /* 启动即查；app.js 的构建号是异步写入的，load 后再查一次；
     切回前台与每 60 秒各查一次，覆盖「应用一直挂在后台」的场景。 */
  checkUpdate();
  try {
    window.addEventListener('load', checkUpdate);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') checkUpdate();
    }, false);
    setInterval(checkUpdate, 60000);
  } catch (_) {}
  function showFail() {
    if (document.getElementById('sjBootFail')) return;
    var d = document.createElement('div');
    d.id = 'sjBootFail';
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg, #f4f3ef);color:#1f2329;'
      + 'font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;'
      + 'display:flex;align-items:center;justify-content:center;padding:24px';
    d.innerHTML = '<div style="max-width:340px;background:#fff;border-radius:16px;padding:32px 26px;'
      + 'text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)">'
      + '<div style="font-size:19px;font-weight:600;margin-bottom:10px">拾笺没能加载完</div>'
      + '<div style="font-size:13px;color:#4e5969;margin-bottom:20px">可能是网络不稳，或访问链接不完整。'
      + '点下面的按钮用完整链接重新打开。</div>'
      + '<button id="sjBootRetry" style="width:100%;padding:12px;border:1px solid #cfe0fb;border-radius:10px;'
      + 'background:#e3eeff;color:#0b57d0;font-size:15px;font-weight:600">重新打开拾笺</button></div>';
    document.body.appendChild(d);
    var btn = document.getElementById('sjBootRetry');
    if (btn) btn.onclick = function () {
      try { sessionStorage.removeItem('sj_sc_fixed'); sessionStorage.removeItem('sj_boot_reload'); } catch (_) {}
      location.replace(u.origin + '/?sharecode=' + SC);
    };
  }
  function watch() {
    var tries = 0, panel = null;
    var timer = setInterval(function () {
      tries++;
      var ready = !!(window.SJLocal && window.SJLocal.api);
      if (ready) {
        if (panel) panel.remove();
        clearInterval(timer);
        return;
      }
      /* 脚本明确报错（403 / 断网，<script onerror> 会置位）就别再等，立刻给出口；
         单纯「还没下载完」不置位，也就不至于把慢网误判成故障。 */
      if (window.__SJ_LOAD_ERR && !panel) {
        clearInterval(timer);
        showFail();
        panel = document.getElementById('sjBootFail');
        return;
      }
      /* 自愈重载从 6 秒放宽到 10 秒、失败页从 8 秒放宽到 18 秒：点「点此更新」
         清完缓存后首屏要把 app.js/local.js/mobilesync.js 全部重新拉一遍，
         原来的 8 秒在移动网络下经常还没下完，反而弹出「没能加载完」。 */
      if (tries === 10 && !reloaded) {
        try { sessionStorage.setItem('sj_boot_reload', '1'); } catch (_) {}
        clearInterval(timer);
        location.reload();
        return;
      }
      if (tries >= 18 && !panel) { showFail(); panel = document.getElementById('sjBootFail'); }
      if (tries >= 45) clearInterval(timer);
    }, 1000);
  }
  if (document.readyState === 'complete') watch();
  else window.addEventListener('load', watch);
})();
</script>

     manifest / 图标 / apple-touch-icon 都必须自带 ?sharecode=，

<body>
<!-- ============ 手机端顶栏（仅窄屏显示） ============ -->
<header class="m-bar" id="mBar">
  <button class="icon-btn" id="mTreeBtn" aria-label="打开目录" title="目录">
    <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <!-- 返回出口要一眼可见：以前和「目录」都是三条横线的纯图标，
       打开笔记后用户找不到回列表的路，会以为页面卡住。 -->
  <button class="icon-btn m-back" id="mListBtn" aria-label="返回笔记列表" title="返回笔记列表">
    <svg viewBox="0 0 24 24" class="ico"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="m-back-label">列表</span>
  </button>
  <!-- 顶栏中间放「当前位置」：打开笔记时是笔记标题，否则是列表名（全部笔记 / 分类名）。
       与桌面端 index.html 的 .m-bar-title 逐字同款（同一段 CSS、同一个 syncBarTitle）。
       曾一度改成朱砂方块 + 拾笺 + 朱点的固定品牌，手机上看着更"完整"，
       但品牌每屏都在、位置信息只此一处；而且方块 + 20px 字挤掉两三个字的标题空间。 -->
  <div class="m-bar-title" id="mBarTitle">拾笺</div>
  <button class="icon-btn" id="mSyncBtn" aria-label="同步到云端" title="同步到云端">
    <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
  </button>
  <!-- 华为 / EMUI 自带浏览器不读 manifest shortcuts，长按图标没有「随手记」。
