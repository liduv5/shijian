<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* 访问码自愈 + 加载兜底（必须内联、必须最先执行）
   站点静态资源要求带 ?sharecode=。手机浏览器若丢失访问码 cookie，
   HTML 能显示但所有 js/css 会 403，表现为「进度条卡住、按钮点不动」。
   这里不依赖任何外部资源：补参数、注册 SW、加载失败时自动重载一次并给出入口。 */
(function () {
  /* 访问码会随重新发布变化，写死迟早过期：优先用当前链接里的码并记住，
     以后从桌面图标 / 裸链接打开时自动补回最新的那个。 */
  var SC_LS = 'sj_sharecode';
  var u = new URL(location.href);
  var fromUrl = u.searchParams.get('sharecode') || '';
  var SC = fromUrl || 'SSYXUMSNMI';
  /* 发布时五处同步改：这里 SWV、sw.js VERSION、pwa.js SW_BUILD 兜底、
     mobilesync.js BUILD、quick.html 末尾 SW 注册脚本里的 SWV。
     内联兜底注册必须和 pwa.js / 速记页用**完全相同**的脚本 URL：两个不同
     v= 会互相顶替安装，每次启动都触发 controllerchange → 整页自动刷新，
     刚点开的列表抽屉被刷掉，看起来就是「闪一下又回到笔记」。 */
  var SWV = '2026-11-12-76';
  window.__SJ_SWV__ = SWV;
  try {
    var saved = localStorage.getItem(SC_LS) || '';
    if (fromUrl && fromUrl !== saved) localStorage.setItem(SC_LS, fromUrl);
    else if (!fromUrl && saved) SC = saved;
  } catch (_) {}
  var hadCode = !!u.searchParams.get('sharecode');
  var fixed = false, reloaded = false;
  try {
    fixed = sessionStorage.getItem('sj_sc_fixed') === '1';
    reloaded = sessionStorage.getItem('sj_boot_reload') === '1';
  } catch (_) {}
  if (!hadCode && !fixed) {
    try { sessionStorage.setItem('sj_sc_fixed', '1'); } catch (_) {}
    u.searchParams.set('sharecode', SC);
    location.replace(u.toString());
    return;
  }
  /* 即使后面的脚本全挂，也要让 SW 有机会换掉坏缓存 */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try {
      navigator.serviceWorker.register('/sw.js?sharecode=' + SC + '&v=' + SWV, { scope: '/' })
        .catch(function () {});
    } catch (_) {}
  }
  /* 版本守卫。写在这里而不是 app.js 里，因为 HTML 每次都是从网络取的、一定是
     新的，而它引用的 app.js 可能被旧 Service Worker 塞了缓存 —— 于是「页面是
     新的、脚本是旧的」，行为跟前一版一模一样，界面上还看不出来。这就是「改了
     好多次都没反应」的来源。这里拿接管页面的 SW 版本号和 SWV 比，不一致就
     注销 SW + 清空缓存 + 重载一次（每次会话只做一次，避免来回刷）。 */
  if ('serviceWorker' in navigator) {
    /* 标记里存的是**版本号**而不是 '1'：每次发布 SWV 都会变，于是每个新版本都能
       再拿到一次自愈机会。早先写死 '1' 时，同一会话里发布的新版永远等不到修复 ——
       手机一直跑旧 app.js，界面上却完全看不出来（-54/-55「点了没反应」很可能就是
       这个叠加出来的）。 */
    var verFixed = false;
    try { verFixed = sessionStorage.getItem('sj_ver_fix') === SWV; } catch (_) {}
    var verGuard = function () {
      if (verFixed) return;
      var c = null;
      try { c = navigator.serviceWorker.controller; } catch (_) {}
      if (!c) return;
      var have = '';
      try { have = new URL(c.scriptURL).searchParams.get('v') || ''; } catch (_) {}
      if (have === SWV) return;
      verFixed = true;
      try { sessionStorage.setItem('sj_ver_fix', SWV); } catch (_) {}
      Promise.resolve()
        .then(function () { return navigator.serviceWorker.getRegistrations(); })
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .then(function () {
          var t = new URL(location.href);
          t.searchParams.set('fix', String(Date.now()));
          location.replace(t.toString());
        })
        .catch(function () {});
    };
    verGuard();
    try {
      navigator.serviceWorker.addEventListener('controllerchange', verGuard);
    } catch (_) {}
  }
  function showFail() {
    if (document.getElementById('sjBootFail')) return;
    var d = document.createElement('div');
    d.id = 'sjBootFail';
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#f5f6fa;color:#1f2329;'
      + 'font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;'
      + 'display:flex;align-items:center;justify-content:center;padding:24px';
    d.innerHTML = '<div style="max-width:340px;background:#fff;border-radius:16px;padding:32px 26px;'
      + 'text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)">'
      + '<div style="font-size:19px;font-weight:600;margin-bottom:10px">拾笺没能加载完</div>'
      + '<div style="font-size:13px;color:#4e5969;margin-bottom:20px">可能是网络不稳，或访问链接不完整。'
      + '点下面的按钮用完整链接重新打开。</div>'
      + '<button id="sjBootRetry" style="width:100%;padding:12px;border:0;border-radius:10px;'
      + 'background:#2f6f5e;color:#fff;font-size:15px">重新打开拾笺</button></div>';
    document.body.appendChild(d);
    var btn = document.getElementById('sjBootRetry');
    if (btn) btn.onclick = function () {
      try { sessionStorage.removeItem('sj_sc_fixed'); sessionStorage.removeItem('sj_boot_reload'); } catch (_) {}
      location.replace(u.origin + '/?sharecode=' + SC);
    };
  }
  function watch() {
    var tries = 0, panel = null;
    var timer = setInterval(function () {
      tries++;
      var ready = !!(window.SJLocal && window.SJLocal.api);
      if (ready) {
        if (panel) panel.remove();
        clearInterval(timer);
        return;
      }
      if (tries === 6 && !reloaded) {
        try { sessionStorage.setItem('sj_boot_reload', '1'); } catch (_) {}
        clearInterval(timer);
        location.reload();
        return;
      }
      if (tries >= 8 && !panel) { showFail(); panel = document.getElementById('sjBootFail'); }
      if (tries >= 30) clearInterval(timer);
    }, 1000);
  }
  if (document.readyState === 'complete') watch();
  else window.addEventListener('load', watch);
})();
</script>

     manifest / 图标 / apple-touch-icon 都必须自带 ?sharecode=，
     否则浏览器拿到的是一页 403 HTML，manifest 解析直接报语法错误、
     装到桌面时没有图标。换访问码时这几处要一起改。 -->

<body>
<!-- ============ 手机端顶栏（仅窄屏显示） ============ -->

    <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <!-- 返回出口要一眼可见：以前和「目录」都是三条横线的纯图标，
       打开笔记后用户找不到回列表的路，会以为页面卡住。 -->

    <svg viewBox="0 0 24 24" class="ico"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="m-back-label">列表</span>
  </button>
  <!-- 顶栏品牌区与电脑版同款：朱砂小印方块 + 书法体「拾笺」+ 落款朱点。
       原本这里显示「当前笔记名/列表名」，改成固定品牌后，位置信息仍由
       列表页头部 #listTitle 与编辑器标题框呈现（见 app.js syncBarTitle）。 -->
  <div class="m-bar-title" id="mBarTitle" aria-label="拾笺">
    <span class="m-logo" aria-hidden="true">拾</span>
    <span class="m-wordmark" aria-hidden="true">拾笺<i class="m-seal"></i></span>
  </div>
  <button class="icon-btn" id="mSyncBtn" aria-label="同步到云端" title="同步到云端">
    <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
  </button>
  <!-- 华为 / EMUI 自带浏览器不读 manifest shortcuts，长按图标没有「随手记」。
       给一个 App 内不依赖系统快捷方式的入口，同标签跳到速记页。 -->
  <button class="icon-btn m-quick" id="mQuickBtn" aria-label="随手记（速记）" title="随手记">
    <svg viewBox="0 0 24 24" class="ico"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>
    <span class="m-quick-label">随手记</span>
  </button>
  <button class="icon-btn" id="mNewBtn" aria-label="新建笔记" title="新建笔记">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>
<div class="m-mask" id="mMask"></div>

<div class="app">

         两行，竖排成一条 52px 的窄栏后，省下的高度全给了目录树。

      <button class="rail-btn rail-new" id="newNoteBtn" data-tip="新建笔记" aria-label="新建笔记">

        <span class="rail-label">新建</span>

      <div class="rail-sep" aria-hidden="true"></div>

      </button>
      <button class="rail-btn" id="exportBtn" data-tip="导出备份" aria-label="导出备份">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 13V3M8.5 6.5 12 3l3.5 3.5M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="rail-btn" id="syncBtn" data-tip="同步到云端" aria-label="同步到云端">
        <svg viewBox="0 0 24 24" class="ico"><path d="M20 12a8 8 0 0 0-13.7-5.7"/><path d="M6.3 2.5v3.8h3.8"/><path d="M4 12a8 8 0 0 0 13.7 5.7"/><path d="M17.7 21.5v-3.8h-3.8"/></svg>
      </button>
      <div class="rail-grow"></div>
      <button class="rail-btn" id="themeBtn" data-tip="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" class="ico ico-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="sb-main">
    <header class="brand">
      <div class="logo" aria-hidden="true">拾</div>
      <div class="brand-text">
        <h1>拾笺<i class="seal" aria-hidden="true"></i></h1>
        <span id="statText">云端笔记库</span>
      </div>
    </header>

    <div class="search-box">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索笔记…" autocomplete="off">
      <kbd>⌘K</kbd>
    </div>

    <div class="side-body">
      <div class="side-scroll" id="sideScroll">
        <!-- 最近笔记：最近 6 条平铺，默认收起 -->

            </span>
          </div>
          <div class="recent-list" id="recentList"></div>

        <div class="tree-head">
          <span>目录</span>

            </button>
          </div>

        <nav class="tree" id="tree"></nav>

    <div class="tag-section" id="tagSection">

          <button class="tag-manage" id="tagManageBtn" title="管理标签">管理</button>
        </span>
      </div>
      <div class="tag-cloud" id="tagCloud"></div>
    </div>

    </div><!-- /.sb-main -->

    <input type="file" id="importInput" accept=".json,application/json,.vault" class="hidden">
  </aside>

  <!-- ============ 笔记列表 ============ -->

    <header class="list-head">

        </button>
        <button class="icon-btn sm" id="newNoteBtn2" title="新建笔记">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
        </button>

    <div class="note-list" id="noteList"></div>

          <rect x="34" y="26" width="98" height="120" rx="8" stroke="currentColor" stroke-width="1.6" opacity=".28"/>
          <rect x="46" y="14" width="98" height="120" rx="8" fill="var(--surface)" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
          <path d="M64 42h62M64 60h62M64 78h44M64 96h52" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".22"/>
          <path d="M64 114h30" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round" opacity=".8"/>
        </svg>
      </div>
      <h3>选一条继续整理，或新建一条知识片段</h3>
