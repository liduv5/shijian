<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef" id="metaTheme">
<meta name="color-scheme" content="light dark">
<title>随手记</title>
<link rel="manifest" href="/quick.webmanifest?sharecode=X4WPKTHLIN">
<!-- 速记专用图标：绿色铅笔，和朱红「拾」字主图标区分开。
     这个站点裸静态路径一律 403，所有图标 / manifest 都必须自带访问码。 -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-quick-32.png?sharecode=X4WPKTHLIN">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-quick.png?sharecode=X4WPKTHLIN">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="随手记">
<meta name="application-name" content="随手记">
<meta name="format-detection" content="telephone=no">
<style>
  /* 与拾笺主程序共用同一套字体（本地嵌入，离线可用） */
  @font-face {
    font-family: "SJBrand";
    src: url("sj-brand.woff2") format("woff2");
    font-style: normal; font-weight: normal; font-display: swap;
    unicode-range: U+62FE, U+7B3A;
  }
  @font-face {
    font-family: "SJText";
    src: url("SJText-400.woff2") format("woff2");
    font-style: normal; font-weight: 400; font-display: swap;
    unicode-range: U+0020-007E, U+00A0-00FF, U+2000-206F, U+20A0-20CF,
      U+2100-214F, U+2190-21FF, U+2200-22FF, U+3000-303F, U+4E00-9FA5, U+FF00-FFEF;
  }
  @font-face {
    font-family: "SJText";
    src: url("SJText-500.woff2") format("woff2");
    font-style: normal; font-weight: 500; font-display: swap;
    unicode-range: U+0020-007E, U+00A0-00FF, U+2000-206F, U+20A0-20CF,
      U+2100-214F, U+2190-21FF, U+2200-22FF, U+3000-303F, U+4E00-9FA5, U+FF00-FFEF;
  }
  @font-face {
    font-family: "SJText";
    src: url("SJText-700.woff2") format("woff2");
    font-style: normal; font-weight: 700; font-display: swap;
    unicode-range: U+0020-007E, U+00A0-00FF, U+2000-206F, U+20A0-20CF,
      U+2100-214F, U+2190-21FF, U+2200-22FF, U+3000-303F, U+4E00-9FA5, U+FF00-FFEF;
  }
  :root {
    --font-ui: "SJText", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    --font-brand: "SJBrand", "STXingkai", "华文行楷", "KaiTi", "楷体", "STKaiti", "Kaiti SC", "Songti SC", "SimSun", serif;
    --r-sm: 7px; --r-md: 10px; --r-lg: 14px;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  /* 与主程序逐字一致的明暗色卡 */
  html[data-theme="light"] {
    --bg: #f4f3ef; --surface: #fffefc; --surface-2: #eceae4; --surface-3: #e3e0d8;
    --border: #e2dfd6; --border-strong: #d3cfc4;
    --text: #22201c; --text-2: #6c675d; --text-3: #9c968a;
    --accent: #2f6f5e; --accent-hover: #255a4c;
    --accent-soft: rgba(47, 111, 94, .10); --accent-line: rgba(47, 111, 94, .28);
    --star: #c8892a; --danger: #c0442f; --danger-soft: #fbecec; --danger-line: #ecd0d0; --danger-text: #8a4242;
    --shadow-sm: 0 1px 2px rgba(34, 32, 28, .05);
    --shadow-md: 0 8px 28px -10px rgba(34, 32, 28, .18);
    --seal: #b04932; --desk-bg: #eef5f1; --desk-line: #cfe2d8; --desk-text: #3c5d51;
    --desk-url-bg: #fff; --desk-url-line: #b9d3c6; --desk-url-text: #2b4a3f;
  }
  html[data-theme="dark"] {
    --bg: #141618; --surface: #1b1e20; --surface-2: #23272a; --surface-3: #2c3134;
    --border: #2c3134; --border-strong: #3a4044;
    --text: #e9e6e0; --text-2: #a3a7a3; --text-3: #767c78;
    --accent: #63b79d; --accent-hover: #7cc9b0;
    --accent-soft: rgba(99, 183, 157, .12); --accent-line: rgba(99, 183, 157, .35);
    --star: #d8a44a; --danger: #e07a63; --danger-soft: #2e1f1c; --danger-line: #57352d; --danger-text: #e7a08e;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .25);
    --shadow-md: 0 8px 28px -10px rgba(0, 0, 0, .55);
    --seal: #cf6549; --desk-bg: #1b2a26; --desk-line: #2f4a42; --desk-text: #a9cabd;
    --desk-url-bg: #141a18; --desk-url-line: #3c5a50; --desk-url-text: #bcd8cd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh; padding: 24px 18px;
    background: var(--bg); color: var(--text);
    font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  /* 手机端：卡片默认就固定在偏上位置（一进入即在此处），
     输入法弹起时整卡仍在键盘上方、完整可见，不依赖键盘事件检测。 */
  @media (max-width: 980px) {
    body { justify-content: flex-start; padding-top: clamp(20px, 9vh, 84px); }
  }
  .card {
    width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 22px 20px; box-shadow: var(--shadow-md);
  }
  h1 { margin: 0 0 8px; font-size: 19px; font-weight: 600; color: var(--text); }
  p { margin: 0 0 16px; font-size: 13px; line-height: 1.7; color: var(--text-2); }
  .box {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 12px 14px; margin-bottom: 16px;
    font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
    max-height: 260px; overflow: auto; color: var(--text);
  }
  textarea {
    width: 100%; min-height: 150px; padding: 12px 14px; margin-bottom: 14px;
    border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg);
    font: inherit; font-size: 14px; line-height: 1.7; color: var(--text); resize: vertical;
  }
  textarea::placeholder { color: var(--text-3); }
  textarea:focus, .box:focus { outline: 2px solid var(--accent-line); outline-offset: -1px; border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  button, a.btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center;
    height: 40px; padding: 0 16px; border-radius: var(--r-md); font: inherit; font-size: 14px;
    text-decoration: none; cursor: pointer; border: 1px solid var(--accent);
    transition: background-color .15s var(--ease), color .15s var(--ease), filter .15s var(--ease);
  }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-hover); }
  .ghost { background: transparent; color: var(--accent); }
  .ghost:hover { background: var(--accent-soft); }
  .tip { margin-top: 16px; font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
  .ok { color: var(--accent); font-size: 14px; margin-bottom: 12px; }
  .desk { background: var(--desk-bg); border: 1px solid var(--desk-line); border-radius: var(--r-md);
    padding: 12px 14px; font-size: 12px; line-height: 1.7; color: var(--desk-text); margin-bottom: 16px; }
  .desk[hidden], .isolated[hidden] { display: none; }
  .desk-h { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--accent); }
  .desk-url { background: var(--desk-url-bg); border: 1px dashed var(--desk-url-line); border-radius: var(--r-sm);
    padding: 8px 10px; margin: 8px 0; font-size: 11px; line-height: 1.55;
    word-break: break-all; user-select: all; color: var(--desk-url-text); }
  .desk-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .desk-row button { flex: 0 0 auto; height: 32px; padding: 0 14px; font-size: 12px; }
  .desk-state { font-size: 11px; color: var(--accent); margin-top: 6px; }
  .desk-state:empty { display: none; }
  .isolated { background: var(--danger-soft); border: 1px solid var(--danger-line); color: var(--danger-text);
    border-radius: var(--r-md); padding: 10px 12px; font-size: 12px; line-height: 1.7; margin-bottom: 16px; }
  /* 华为风底部双 tab：与主程序同款，「笔记」回主程序（走 goMain 带 q 参数）。
     手机上贴边通栏；电脑宽屏上收进卡片宽度、做成圆角悬浮条，不再横贯整屏。 */
  .q-tabbar {
    display: flex; position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 30;
    width: min(520px, calc(100% - 36px));
    height: 56px; padding-bottom: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); box-shadow: var(--shadow-md); overflow: hidden;
  }
  .q-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 0; background: transparent; font: inherit; font-size: 11px; color: var(--text-3);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .q-tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .q-tab.active { color: var(--accent); }
  /* 手机窄屏：底栏贴底通栏，和主程序手机端一致 */
  @media (max-width: 600px) {
    .q-tabbar {
      left: 0; right: 0; bottom: 0; transform: none;
      width: 100%; height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border: 0; border-top: 1px solid var(--border); border-radius: 0;
      box-shadow: none;
    }
    body { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  }
  /* ============================================================
     手机端（≤980px）配色：与主程序手机端一致——冷灰白底 + 华为蓝。
     手机端保留朱砂小印与行楷品牌（主程序手机端同样保留），只换色卡；
     桌面端（≥981px）仍走下方中性灰块，互不干扰。
     ============================================================ */
  @media (max-width: 980px) {
    html[data-theme="light"] {
      --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f1f1f4; --surface-3: #e8e8ec;
      --border: #efeff2; --border-strong: #dedee4;
      --text: #1c1c1e; --text-2: #6c6c72; --text-3: #9b9ba1;
      --accent: #0a59f7; --accent-hover: #0846c4;
      --accent-soft: rgba(10, 89, 247, .10); --accent-line: rgba(10, 89, 247, .28);
      --star: #e8a317; --danger: #e5484d; --danger-soft: #fdecec;
      --danger-line: #f4cdcd; --danger-text: #b02a2a; --sel: rgba(10, 89, 247, .14);
      --shadow-sm: 0 1px 3px rgba(20, 20, 26, .05);
      --shadow-md: 0 8px 26px -10px rgba(20, 20, 26, .20);
      --shadow-lg: 0 20px 46px -16px rgba(20, 20, 26, .26);
    }
    html[data-theme="dark"] {
      --accent: #4d8fff; --accent-hover: #6ba4ff;
      --accent-soft: rgba(77, 143, 255, .16); --accent-line: rgba(77, 143, 255, .38);
      --sel: rgba(77, 143, 255, .22);
    }
  }
  /* ============================================================
     电脑端（≥981px）中性简约风：与主程序同一套观感。
     去掉朱砂小印 / 朱点 / 行楷，墨绿强调色改中性石墨灰，绿色系
     桌面提示条一并中性化；整块只在 min-width:981px 生效，手机端
     保持墨绿品牌不动。
     ============================================================ */
  @media (min-width: 981px) {
    html[data-theme="light"] {
      --accent: #43403a; --accent-hover: #2e2c28;
      --accent-soft: rgba(67, 64, 58, .09); --accent-line: rgba(67, 64, 58, .26);
      --star: #6d6860; --danger: #5f5a53; --danger-soft: #f1efeb;
      --danger-line: #dcd8d0; --danger-text: #5f5a53;
      --desk-bg: #f1efeb; --desk-line: #dcd8d0; --desk-text: #5f5a53;
      --desk-url-bg: #fff; --desk-url-line: #cfcbc2; --desk-url-text: #43403a;
    }
    html[data-theme="dark"] {
      --accent: #d5d0c7; --accent-hover: #ece8e1;
      --accent-soft: rgba(213, 208, 199, .13); --accent-line: rgba(213, 208, 199, .32);
      --star: #b0aba2; --danger: #b8b3aa; --danger-soft: #262420;
      --danger-line: #473f36; --danger-text: #b8b3aa;
      --desk-bg: #262420; --desk-line: #473f36; --desk-text: #b8b3aa;
      --desk-url-bg: #141618; --desk-url-line: #49443c; --desk-url-text: #d5d0c7;
    }
    /* 深色下 accent 变浅，实心按钮换深色字才看得清 */
    html[data-theme="dark"] .primary { color: #1c1a17; }
  }
</style>
</head>
<body>
<div class="card">
  <div id="view"></div>
  <div class="isolated" id="isolatedTip" hidden>这个图标被独立安装过，有自己的数据分区。请删掉它，改用主程序顶栏的「随手记」。</div>
  <div class="desk" id="deskTip" hidden>
    <div class="desk-h">想从桌面一步打开随手记？</div>
    <div>先删掉旧的随手记图标，再复制下面的地址到浏览器打开，点菜单「<b>安装应用</b>」（没有就选「添加到主屏幕」）。新图标是<b>绿色铅笔</b>，从桌面打开不带地址栏。</div>
    <div class="desk-url" id="deskUrl"></div>
    <div class="desk-row">
      <button type="button" class="ghost" id="copyDesk">复制地址</button>
      <button type="button" class="ghost" id="hideDesk">已有图标，不再显示</button>
    </div>
    <div class="desk-state" id="copyState"></div>
  </div>
  <div class="tip">速记先存在本页，点「打开拾笺」进笔记库。</div>
</div>
<nav class="q-tabbar" aria-label="主导航">
  <button type="button" class="q-tab" id="qTabNotes" aria-label="笔记">
    <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg><span>笔记</span>
  </button>
  <button type="button" class="q-tab active" aria-label="随手记">
    <svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg><span>随手记</span>
  </button>
</nav>
<script>
(function () {
  'use strict';
  /* 主题跟随主程序：读同一个 sj_theme，配色/字体/明暗整套和拾笺一致。
     独立安装的随手记有隔离存储，读不到就跟随系统；同分区打开时若主程序
     在另一个标签切了主题，storage 事件也会实时同步过来。 */
  function applyTheme(t) {
    var theme = t === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    var mt = document.getElementById('metaTheme');
    if (mt) mt.setAttribute('content', theme === 'dark' ? '#141618' : '#f4f3ef');
  }
  var initTheme;
  try { initTheme = localStorage.getItem('sj_theme'); } catch (_) {}
  if (!initTheme) {
    initTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(initTheme);
  try {
    window.addEventListener('storage', function (e) {
      if (e.key === 'sj_theme') applyTheme(e.newValue);
    });
  } catch (_) {}

  /* 随手记不再持有本地库。独立安装的 PWA / 系统分享会拿到一套隔离的
     localStorage，往里面写笔记就永远进不了主程序。所以这里只把速记
     编进链接 / 共享队列，交给主程序落盘；旧版本遗留在本分区的笔记
     一并带回。队列由主程序确认导入后才清，本页绝不提前标记「已发送」。 */
  const SC = 'X4WPKTHLIN';
  /* 必须写到主程序的正式入口：相对路径会留在随手记自己的存储分区里。
     换分享链接域名时，这里和 SC 一起改。 */
  /* 主程序入口随发布域名走：换链接/换访问码时这里自动跟随，不再写死旧域名。 */
  const MAIN = location.origin + '/?sharecode=' + SC + '&fs=pwa';
  /* 桌面快捷方式专用地址：必须带 from=desk，普通网页快捷方式与主程序
     同一套数据，独立安装的窗口则靠 window.open 跳回浏览器主窗口。 */
  const DESK_URL = location.origin + '/quick.html?sharecode=' + SC + '&from=desk';
  const MAIN_FLAG = 'sj_main_lib';
  const PENDING = 'sj_quick_pending';
  /* 主程序成功落盘后写这个。两个窗口共用 localStorage 时，本页据此
     不再重复发送；分区隔离时读不到，速记会一直保留，可反复补发。 */
  const IMPORTED = 'sj_quick_imported';
  /* 浏览器没有「查询桌面已有图标」的 API（华为自带浏览器尤其没有），
     所以只认两条可靠信号：① 用户确实从桌面图标进来过（from=desk）；
     ② 用户点「已有图标，不再显示」。localStorage 供同分区窗口读，cookie
     供同 origin 的普通标签读；独立安装的隔离分区读不到，就由 goMain()
     把 deskInstalled=1 写在跳回主程序的链接上，让主程序自己落盘。 */
  const DESK_FLAG = 'sj_quick_desk_installed';
  function deskKnown() {
    try { if (localStorage.getItem(DESK_FLAG) === '1') return true; } catch (_) {}
    try { return /(?:^|;\s*)sj_quick_desk_installed=1(?:;|$)/.test(document.cookie); }
    catch (_) { return false; }
  }
  function markDeskInstalled() {
    try { localStorage.setItem(DESK_FLAG, '1'); } catch (_) {}
    try { document.cookie = DESK_FLAG + '=1; path=/; max-age=31536000; SameSite=Lax'; }
    catch (_) {}
  }
  const MAX_Q = 4000;   // 链路上限，装不下的下次再带
  const CUT = 300;      // 单条过长时截断的字符数，保证至少能带走一条

  const view = document.getElementById('view');
  const qs = new URLSearchParams(location.search);
  /* 恢复入口：删了桌面图标后想重新看安装说明，在地址后加 &desk=1 即可。
     不占界面，也不会因为误点「不再显示」而永远找不回来。 */
  const FORCE_GUIDE = qs.get('desk') === '1';
  /* 从主程序里点「随手记」进来：同一个标签、同一套 localStorage，
     返回时不能再新开窗口，也不能把主库的笔记当成待迁移速记。 */
  const FROM_APP = qs.get('from') === 'app';
  /* 从桌面快捷方式直接进来：它可能是普通网页快捷方式（同一套数据），
     也可能是被独立安装的窗口（有自己的数据分区）。速记一律靠链接参数
     交给主程序，不依赖两边共享 localStorage。 */
  const FROM_DESK = qs.get('from') === 'desk';
  /* 主程序启动时会写这个标记。有标记 = 本分区就是主程序自己的库，
     sj_mobile_v1 里装的是整库笔记，绝不能当「旧速记」灌进 q 参数。
     旧版独立图标的分区没有标记，仍能正常把遗留速记带回来。 */
  function mainLibHere() {
    try { return localStorage.getItem(MAIN_FLAG) === '1'; } catch (_) { return false; }
  }
  function standaloneWindow() {
    try {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || window.navigator.standalone === true;
    } catch (_) { return false; }
  }
  /* 独立窗口 + 读不到主库标记 = 这个图标被单独安装过，有自己的分区 */
  const ISOLATED = standaloneWindow() && !mainLibHere();
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const read = (k, d) => {
    try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }
    catch (_) { return d; }
  };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

  function sigOf(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + '-' + s.length;
  }
  function itemOf(title, content) {
    const t = String(title || '随手记');
    const c = String(content || '');
    /* 随手记是纯文本（用户随手打的字），不是 Markdown。
       存储层只有富文本一种格式，格式统一由主程序那一端处理。 */
    return { title: t.slice(0, 60), content: c, sig: sigOf(t + '|' + c) };
  }
  /* 旧版本往本分区 sj_mobile_v1 写过的速记，删图标前先带回去 */
  function legacy() {
    /* 从主程序 / 桌面快捷方式进来，或本分区跑过主程序时，sj_mobile_v1
       就是主程序自己的整库笔记；再当「遗留速记」带回，会把整库灌进链接
       参数（长文被截断、还可能导入残缺副本），必须跳过。
       只有「无主库标记的独立旧图标分区」才需要迁移。 */
    if (FROM_APP || FROM_DESK || mainLibHere()) return [];
    const d = read('sj_mobile_v1', {});
    return (Array.isArray(d.notes) ? d.notes : [])
      .filter((n) => n && !n.deletedAt && String(n.content || '').trim())
      .map((n) => itemOf(n.title, n.content));
  }
  function pending() { const a = read(PENDING, []); return Array.isArray(a) ? a : []; }
  function fresh() {
    const s = read(IMPORTED, []); const seen = Array.isArray(s) ? s : [];
    return [...pending(), ...legacy()].filter((x) => x && x.sig && !seen.includes(x.sig));
  }
  function addPending(title, content) {
    const it = itemOf(title, content, 'md');
    const list = pending();
    if (!list.some((x) => x && x.sig === it.sig)) write(PENDING, list.concat([it]).slice(-50));
  }
  function encode(items) {
    const picked = [];
    let q = '';
    for (const it of items) {
      const e = encodeURIComponent(JSON.stringify(picked.concat([it])));
      if (e.length <= MAX_Q) { picked.push(it); q = e; continue; }
      if (!picked.length) {
        const cut = Object.assign({}, it, { content: it.content.slice(0, CUT), cut: true });
        const e2 = encodeURIComponent(JSON.stringify([cut]));
        if (e2.length <= MAX_Q) { picked.push(cut); q = e2; }
      }
      break;
    }
    return { q, picked };
  }
  /* 点击时只负责把待发速记编进链接；队列和 pending 都留着，
     直到主程序真正导入成功、写回 sj_quick_imported 为止。 */
  function goMain() {
    const list = fresh();
    const { q, picked } = encode(list);
    /* 从桌面图标进来的这一次，顺手把「桌面图标确实存在」告诉主程序。
       桌面窗口若是被独立安装、有自己的隔离分区，localStorage / cookie
       都传不过去，只有这个链接参数一定送得到。主程序 boot 时会落盘，
       以后从主程序点「随手记」就不再重复显示安装引导。 */
    const url = MAIN + (q ? '&q=' + q : '') + (FROM_DESK ? '&deskInstalled=1' : '');
    const left = Math.max(0, list.length - picked.length);
    /* 2026-11-20：华为桌面把两个图标当成同一任务，window.open 不会真正
       新开独立窗口，反而让点拾笺图标时又切回随手记。改回同窗口跳转：
       「打开拾笺」把当前窗口导航到主程序并随 q 参数导入速记；
       不再用 sj_quick_return 自动弹回，主程序窗口保持主程序页。 */
    location.assign(url);
    return left;
  }
  function bindGo(id) {
    const el = document.getElementById(id);
    if (el) el.onclick = (e) => { e.preventDefault(); goMain(); };
  }
  /* 底部「笔记」tab 同样走 goMain()：带 q 参数把待发速记一起带进主程序，
     绝不裸跳 index.html —— 否则写好的速记不会入库。 */
  bindGo('qTabNotes');

  function compose(text, url, title) {
    let body = String(text || '').trim();
    const link = String(url || '').trim();
    if (link && body.indexOf(link) < 0) body = (body ? body + '\n\n' : '') + link;
    if (!body) body = String(title || '').trim();
    const t = String(title || '').trim() || (body.split('\n')[0] || '随手记').slice(0, 40) || '随手记';
    return { title: t.slice(0, 60), content: body };
  }
  function done(title, content) {
    const left = fresh().length;
    view.innerHTML = '<div class="ok">✓ 已记下，还没进主程序</div>' +
      '<h1>' + esc(title) + '</h1>' +
      '<div class="box">' + esc(content.slice(0, 600)) + '</div>' +
      '<p>点「打开拾笺」把速记带进主程序笔记库' +
        (left > 1 ? '；还有 ' + left + ' 条待带入，一次带不完就多点几次' : '') + '。</p>' +
      '<div class="row"><a class="btn primary" href="#" id="goMain">打开拾笺</a>' +
      '<button class="ghost" id="again">再记一条</button></div>';
    const back = FROM_DESK ? '&from=desk' : (FROM_APP ? '&from=app' : '');
    const force = FORCE_GUIDE ? '&desk=1' : '';
    document.getElementById('again').onclick = () => location.replace(
      '/quick.html?sharecode=' + SC + back + force);
    bindGo('goMain');
  }
  function editor() {
    view.innerHTML = '<h1>随手记一笔</h1><p>写点什么，交给拾笺的笔记库。</p>' +
      '<textarea id="qText" placeholder="想到什么就写什么…"></textarea>' +
      '<div class="row"><button class="primary" id="qSave">存进拾笺</button>' +
      '<a class="btn ghost" href="#" id="goMain2">打开拾笺</a></div>';
    const ta = document.getElementById('qText');
    ta.focus();
    document.getElementById('qSave').onclick = () => {
      const v = ta.value.trim();
      if (!v) { ta.focus(); return; }
      const c = compose(v, '', '');
      addPending(c.title, c.content);
      done(c.title, c.content);
    };
    bindGo('goMain2');
  }

  /* 桌面一步直达的引导只在「从主程序点随手记进来、且桌面还没装图标」时
     出现；已经从桌面图标进来过一次，页面从此保持干净，不再重复说明。 */
  (function deskGuide() {
    if (ISOLATED) {
      const t = document.getElementById('isolatedTip');
      if (t) t.hidden = false;
    }
    /* 能进到这一页就证明桌面图标存在且可用，先把事实记进本分区 */
    if (FROM_DESK) markDeskInstalled();
    if (!FROM_APP) return;
    const box = document.getElementById('deskTip');
    const urlEl = document.getElementById('deskUrl');
    if (!box || !urlEl) return;
    const hide = () => { box.hidden = true; };
    if (!FORCE_GUIDE && deskKnown()) hide();
    else {
      urlEl.textContent = DESK_URL;
      box.hidden = false;
    }
    /* 另一个窗口刚装好图标时，这一页也立刻收起引导，不用重开 */
    window.addEventListener('storage', (e) => {
      if (e && e.key === DESK_FLAG && e.newValue === '1' && !FORCE_GUIDE) hide();
    });
    const hideBtn = document.getElementById('hideDesk');
    if (hideBtn) hideBtn.onclick = () => { markDeskInstalled(); hide(); };
    const btn = document.getElementById('copyDesk');
    const st = document.getElementById('copyState');
    if (btn) btn.onclick = async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(DESK_URL);
        } else {
          const ta = document.createElement('textarea');
          ta.value = DESK_URL;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
          document.body.appendChild(ta);
          ta.select();
          if (!document.execCommand('copy')) throw new Error('copy failed');
          ta.remove();
        }
        if (st) st.textContent = '已复制，到浏览器地址栏打开它';
      } catch (_) {
        if (st) st.textContent = '复制失败，请长按上面的地址手动复制';
      }
    };
  })();

  /* 从主程序按返回键、或浏览器把本页从 bfcache 复原时，DOM 可能还停在
     「已记下 / 打开拾笺」确认页。再次进随手记应看到干净的编辑页。
     只在确认页时重置，绝不覆盖用户正在输入但还没保存的那段文字。 */
  window.addEventListener('pageshow', (e) => {
    if (!e || !e.persisted) return;
    if (qs.get('text') || qs.get('url') || qs.get('title')) return;
    if (document.getElementById('again')) editor();
  });

  const text = qs.get('text') || '';
  const url = qs.get('url') || '';
  const title = qs.get('title') || '';
  if (!text && !url && !title) { editor(); return; }

  const c = compose(text, url, title);
  const content = '# ' + c.title + '\n\n' + c.content;
  const sig = [c.title, c.content].join('|');
  const KEY = 'sj_quick_last';
  let already = false;
  try { already = localStorage.getItem(KEY) === sig; } catch (_) {}
  if (!already) {
    addPending(c.title, content);
    try { localStorage.setItem(KEY, sig); } catch (_) {}
  }
  /* 系统分享进来时直接把内容送进主程序，避免用户关掉页面就丢 */
  goMain();
  done(c.title, c.content);
})();
</script>
<script>
/* 让速记页也满足「可安装 PWA」的条件：standalone 启动需要一个已激活的
   Service Worker。必须先查已有注册 —— 主程序已经注册了带 &v= 版本号的
   /sw.js（scope 覆盖整站），这里若用另一个 URL 注册，两处会互相顶替
   安装，每次打开主程序都触发 controllerchange → 整页自动刷新。 */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var SWV = '2026-11-28-202';   /* 发布清单第五处，与 index.html 的 SWV 一致 */
  var sc = new URLSearchParams(location.search).get('sharecode') || 'X4WPKTHLIN';
  var url = '/sw.js?sharecode=' + encodeURIComponent(sc) + '&v=' + SWV;
  navigator.serviceWorker.getRegistration().then(function (reg) {
    if (reg && reg.active) return;      /* 已有 SW：直接复用，绝不重复注册 */
    return navigator.serviceWorker.register(url, { scope: '/' });
  }).catch(function () {});
})();
</script>
