<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f3ef">
<title>拾笺</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/sjplus.css">
<link rel="stylesheet" href="/vendor/github-dark.min.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<!-- ============ 手机端顶栏（仅窄屏显示） ============ -->
<header class="m-bar" id="mBar">
  <button class="icon-btn" id="mTreeBtn" aria-label="打开目录" title="目录">
    <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="m-bar-title" id="mBarTitle">拾笺</div>
  <button class="icon-btn" id="mListBtn" aria-label="笔记列表" title="笔记列表">
    <svg viewBox="0 0 24 24" class="ico"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
  </button>
</header>
<div class="app">

  <!-- 手机端抽屉遮罩。**必须放在 .app 里面**：手机端 .app 是 position:fixed，
       会形成一个新的层叠上下文，抽屉的 z-index:66 就被关在这个上下文里；
       遮罩若留在 .app 外面（z-index:64、在根上下文），就会盖在整个 .app 之上，
       连抽屉一起罩住 —— 点菜单/列表整屏变暗、抽屉内容看不见（2026-11-12 20:46 反馈）。
       放进同一个上下文后 64 < 66 才恢复原本的「遮罩在内容上、抽屉在遮罩上」。
       它自己 position:fixed 且四边都给全，不参与 .app 的网格排布。 -->
  <div class="m-mask" id="mMask"></div>

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <!-- 图标栏：新建 / 导入 / 导出 / 同步 / 主题。原来这五个按钮占着侧栏底部
         两行（91px 高），竖排成一条 52px 的窄栏后，省下的高度全给了目录树。
         窄屏（≤980px）会变成抽屉底部的一横条，见 style.css 的媒体查询。 -->
    <div class="sb-rail">
      <button class="rail-btn rail-new" id="newNoteBtn" data-tip="新建笔记" aria-label="新建笔记">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
        <span class="rail-label">新建</span>
      </button>
      <div class="rail-sep" aria-hidden="true"></div>
      <button class="rail-btn" id="importBtn" data-tip="导入备份" aria-label="导入备份">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v10M8.5 9.5 12 13l3.5-3.5M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="rail-btn" id="exportBtn" data-tip="导出备份" aria-label="导出备份">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 13V3M8.5 6.5 12 3l3.5 3.5M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="rail-btn" id="syncBtn" data-tip="同步到云端" aria-label="同步到云端">
        <svg viewBox="0 0 24 24" class="ico"><path d="M20 12a8 8 0 0 0-13.7-5.7"/><path d="M6.3 2.5v3.8h3.8"/><path d="M4 12a8 8 0 0 0 13.7 5.7"/><path d="M17.7 21.5v-3.8h-3.8"/></svg>
      </button>
      <div class="rail-grow"></div>
      <button class="rail-btn" id="themeBtn" data-tip="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" class="ico ico-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="sb-main">
    <header class="brand">
      <img class="logo" src="/icons/brand-nobg.png" alt="" aria-hidden="true">
      <div class="brand-text">
        <span id="statText">本地笔记库</span>
      </div>
    </header>

    <div class="search-box">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索笔记…" autocomplete="off">
      <kbd id="searchKbd">⌘K</kbd>
    </div>

    <div class="side-body">
      <div class="side-scroll" id="sideScroll">
        <!-- 最近笔记：仿 LumiNote 的两段式侧栏，先给最近 6 条，再给分类树。
             默认收起——上一轮明确要保住目录高度，展开与否记在本地。 -->
        <div class="recent-section collapsed" id="recentSection">
          <div class="tree-head recent-head" id="recentHead" role="button" tabindex="0" aria-expanded="false" title="展开 / 收起最近笔记">
            <span class="tag-head-left">
              <svg viewBox="0 0 24 24" class="ico tag-caret"><path d="M9 6l6 6-6 6"/></svg><span>最近笔记</span>
            </span>
          </div>
          <div class="recent-list" id="recentList"></div>
        </div>

        <div class="tree-head">
          <span>目录</span>
          <div class="tree-head-actions">
            <button class="icon-btn sm" id="helpBtn" title="分类与归属说明" aria-label="分类与归属说明">
              <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1.1.9-1.1 1.7v.3"/><path d="M12 16.8h.01"/></svg>
            </button>
            <button class="icon-btn sm" id="collapseAllBtn" title="全部收起">
              <svg viewBox="0 0 24 24" class="ico"><path d="M4 9l8-6 8 6M4 15l8 6 8-6"/></svg>
            </button>
            <button class="icon-btn sm" id="addRootCatBtn" title="新建顶层类别">
              <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <nav class="tree" id="tree"></nav>
      </div>
      <div class="tree-meta" id="treeMeta" role="tooltip"></div>
    </div>

    <div class="tag-section" id="tagSection">
      <div class="tree-head tag-head" id="tagHead" role="button" tabindex="0" aria-expanded="true" title="收起 / 展开标签">
        <span class="tag-head-left">
          <svg viewBox="0 0 24 24" class="ico tag-caret"><path d="M9 6l6 6-6 6"/></svg><span>标签</span>
        </span>
        <span class="tag-head-right">
          <span class="tag-total" id="tagTotal"></span>
          <button class="tag-manage" id="tagManageBtn" title="管理标签">管理</button>
        </span>
      </div>
      <div class="tag-cloud" id="tagCloud"></div>
    </div>

    </div><!-- /.sb-main -->

    <input type="file" id="importInput" accept=".json,application/json" class="hidden">
  </aside>

  <!-- ============ 笔记列表 ============ -->
  <section class="list-pane">
    <header class="list-head">
      <div class="list-title-wrap">
        <h2 id="listTitle">全部笔记</h2>
        <span id="listCount"></span>
      </div>
      <button class="icon-btn sm" id="newNoteBtn2" title="新建笔记">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="note-list" id="noteList"></div>
  </section>

  <!-- ============ 编辑区 ============ -->
  <main class="editor-pane">
    <!-- 首页：没打开笔记时占据主区。仿 LumiNote 的卡片网格，两个视图——
         「全部笔记」看内容摘要与分类路径，「文件夹」看分类本身。 -->
    <section class="home" id="emptyState">
      <header class="home-head">
        <div class="home-tabs" role="tablist" aria-label="视图">
          <button class="home-tab on" id="homeTabNotes" data-home-tab="notes" role="tab" aria-selected="true">全部笔记</button>
          <button class="home-tab" id="homeTabFolders" data-home-tab="folders" role="tab" aria-selected="false">文件夹</button>
        </div>
        <div class="home-acts">
          <button class="btn ghost sm" id="homeNewFolder">+ 新建文件夹</button>
          <button class="btn primary sm" id="homeNewNote">+ 新建笔记</button>
        </div>
      </header>
      <div class="home-grid" id="homeGrid"></div>
    </section>

    <div class="editor-wrap hidden" id="editorWrap">
      <header class="editor-head">
        <button class="icon-btn editor-back" id="editorBack" title="返回全部笔记" aria-label="返回全部笔记">
          <svg viewBox="0 0 24 24" class="ico"><path d="M20 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        </button>
        <input id="titleInput" class="title-input" placeholder="无标题笔记" spellcheck="false">
        <div class="editor-actions">
          <!-- 阅读态的「Aa」：只调字号、行距（本机显示偏好），不改正文 -->
          <button class="icon-btn read-aa-btn" id="readAaBtn" title="字体与行距" aria-label="字体与行距">
            <span class="read-aa-glyph">Aa</span>
          </button>
          <!-- 阅读态唯一的「进编辑」入口（2026-11-22：点正文不再进编辑） -->
          <button class="icon-btn" id="readEditBtn" title="编辑这篇笔记" aria-label="编辑">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 20h4L18.5 9.5l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
          </button>
          <button class="icon-btn" id="starBtn" title="收藏">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></svg>
          </button>
          <button class="icon-btn" id="historyBtn" title="历史版本">
            <svg viewBox="0 0 24 24" class="ico"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/><path d="M12 8v4.5l3 1.8"/></svg>
          </button>
          <button class="icon-btn" id="imgBtn" title="插入图片（也可直接粘贴或拖拽图片）" aria-label="插入图片">
            <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-4.5-4.5L11 17l-2-2-4 4"/></svg>
          </button>
          <button class="icon-btn" id="attachBtn" data-tip="添加附件 / 图片" aria-label="添加附件">
            <svg viewBox="0 0 24 24" class="ico"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 6"/></svg>
          </button>
          <button class="icon-btn" id="exportBtn2" title="导出">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
          </button>
          <button class="icon-btn danger-hover" id="deleteNoteBtn" title="删除笔记">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
          </button>
        </div>
        <!-- 华为风编辑态顶栏：撤销 / 重做 / 完成。阅读态隐藏。 -->
        <div class="sj-edit-acts" id="sjEditActs">
          <button type="button" class="sj-ea-btn" id="sjUndoBtn" title="撤销 (⌘Z)" aria-label="撤销" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a5 5 0 0 1 0 10h-2"/></svg>
          </button>
          <button type="button" class="sj-ea-btn" id="sjRedoBtn" title="重做 (⌘⇧Z)" aria-label="重做" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M15 7l5 5-5 5"/><path d="M20 12h-9a5 5 0 0 0 0 10h2"/></svg>
          </button>
          <button type="button" class="sj-ea-btn sj-ea-done" id="sjDoneBtn" title="完成编辑" aria-label="完成编辑">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </button>
        </div>
      </header>

      <!-- 阅读态 Aa 的小浮层：只写本机显示偏好（字号、行距），不碰笔记内容。
           和工具条里那两颗下拉改的是同一套值，所以两边永远一致。 -->
      <div class="read-aa-pop hidden" id="readAaPop" role="dialog" aria-label="字体与行距">
        <div class="raa-row">
          <span class="raa-lab">字号</span>
          <input type="range" id="readAaFs" min="14" max="24" step="1" value="16" aria-label="正文字号">
          <span class="raa-val" id="readAaFsVal">16</span>
        </div>
        <div class="raa-row">
          <span class="raa-lab">行距</span>
          <input type="range" id="readAaLh" min="20" max="48" step="2" value="28" aria-label="正文行距">
          <span class="raa-val" id="readAaLhVal">28</span>
        </div>
        <button type="button" class="raa-reset" id="readAaReset">恢复默认</button>
      </div>

      <div class="meta-row">
        <span id="metaInfo"></span>
        <span class="meta-dot">·</span>
        <span id="saveState" class="save-state"></span>
        <span class="spacer"></span>
        <span id="wordCount" class="word-count"></span>
      </div>

      <div class="tag-row" id="tagRow">
        <span class="tag-row-label">标签</span>
        <div class="tag-list" id="tagList"></div>
        <button class="tag-add" id="tagAddBtn">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input class="tag-input hidden" id="tagInput" list="tagOptions" placeholder="输入标签，回车确认" maxlength="20" autocomplete="off">
        <datalist id="tagOptions"></datalist>
      </div>

      <!-- 编辑工具条：在标题、分类、标签全都下面，紧挨正文常驻一条，
           编辑态直接可用，不再从底部浮出、也不再有右侧弹出面板。 -->
      <div class="toolbar" id="toolbar"></div>

      <div class="editor-body" id="editorBody">
        <!-- 华为风阅读态：大标题放回正文顶部，跟着正文一起上滚；
             滚过顶栏后，顶栏里的小标题淡入接管。编辑态不显示。 -->
        <div class="sj-read-hero" id="sjReadHero">
          <h1 class="sj-rh-title" id="sjReadTitle"></h1>
          <div class="sj-rh-meta" id="sjRhMeta"></div>
        </div>
        <!-- 正文只有这一个容器：存储层是富文本，读出来就是 HTML -->
        <div class="rich-pane markdown-body" id="richPane" contenteditable="true" spellcheck="false"></div>
      </div>

      <div class="attach-panel hidden" id="attachPanel">
        <div class="attach-head">
          <span>附件 <em id="attCount">0</em></span>
          <div class="attach-head-actions">
            <button class="icon-btn sm" id="attachAddBtn" data-tip="添加附件">
              <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="icon-btn sm" id="closeAttachBtn" data-tip="收起">
              <svg viewBox="0 0 24 24" class="ico"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>
        </div>
        <div class="attach-list" id="attachList"></div>
      </div>

      <div class="drop-mask" id="dropMask"><span>松开即可添加附件</span></div>
    </div>
  </main>
</div>

<div class="ctx-menu hidden" id="ctxMenu"></div>
<div class="toast" id="toast"></div>
<div class="modal-root hidden" id="modalRoot"></div>
<input type="file" id="fileInput" multiple hidden>

<div class="print-area" id="printArea"></div>

<script src="/vendor/docx.umd.js"></script>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/turndown.js"></script>
<script src="/vendor/turndown-plugin-gfm.js"></script>
<script src="/vendor/highlight.min.js"></script>
<!-- 富文本 ⇄ Markdown 配置内核：与云端同一份文件（md5 校验）。
     必须在 vendor/turndown 之后、app.js 之前加载。 -->
<script src="/richtext-core.js"></script>
<!-- 分类身份 / 去重内核：与云端同一份文件（md5 校验）。建类查重、
     同步合并都靠它，必须在 app.js 之前加载。 -->
<script src="/cat-core.js"></script>
<script src="/export.js"></script>
<script src="/app.js"></script>
<script src="/sjplus.js"></script>
<script src="/vendor/workbuddy-cloud-sdk.js"></script>
<script src="/sync.js"></script>
<script src="/fts.js"></script>
<script src="/backlinks.js"></script>
<script src="/diffview.js"></script>
<script src="/conflict.js"></script>
<script src="/e2ee.js"></script>
<script src="/settings.js"></script>
</body>
</html>
